name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync supported extras (kafka extra intentionally absent)
        run: uv sync --extra dev --extra api --extra storage --extra postgres --extra online

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run python -m pytest -q

      - name: Build package (wheel + sdist)
        run: uv build

      - name: Validate Docker Compose configuration
        run: docker compose config -q
        env:
          FSP_API_KEYS: ""
