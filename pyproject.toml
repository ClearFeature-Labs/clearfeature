[project]
name = "fintech-feature-platform"
version = "0.1.0"
description = "ClearFeature — open-core feature platform: one Python compute core for online and batch features, point-in-time correctness, and artifact-bound fail-closed serving"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"

dependencies = [
    "prometheus-client>=0.20",
    "pyyaml>=6.0.0",
]

[project.scripts]
fsctl = "fintech_feature_platform.cli.fsctl:main"
[project.urls]
Homepage = "https://github.com/ClearFeature-Labs/clearfeature"
Documentation = "https://github.com/ClearFeature-Labs/clearfeature/tree/main/docs"
Issues = "https://github.com/ClearFeature-Labs/clearfeature/issues"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "fastapi>=0.110",
    "httpx>=0.27"
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29"
]
storage = [
    "minio>=7.2"
]
postgres = [
    "psycopg[binary]>=3.2",
    # Real connection pooling for the local backend.
    "psycopg-pool>=3.2",
]
online = [
    "redis>=5"
]
kafka = [
    "confluent-kafka>=2.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fintech_feature_platform"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
